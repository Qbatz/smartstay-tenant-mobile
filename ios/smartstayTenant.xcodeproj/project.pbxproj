			shellPath = /bin/sh;
			shellScript = "# Copies this configuration's GoogleService-Info.plist (FIREBASE_PLIST, under Build Settings >\n# User-Defined) into the app, and stops the build if it belongs to another bundle identifier.\nSRC=\"${FIREBASE_PLIST}\"\nPROD_PLIST=\"${SRCROOT}/smartstayTenant/Firebase/Prod/GoogleService-Info.plist\"\nDEST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist\"\n\nif [ ! -f \"${SRC}\" ]; then\n  echo \"error: GoogleService-Info.plist not found at ${SRC} (FIREBASE_PLIST for ${CONFIGURATION}).\"\n  exit 1\nfi\nPLIST_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c \"Print :BUNDLE_ID\" \"${SRC}\")\nif [ \"${PLIST_BUNDLE_ID}\" != \"${PRODUCT_BUNDLE_IDENTIFIER}\" ]; then\n  echo \"error: ${SRC} is for ${PLIST_BUNDLE_ID}, but ${CONFIGURATION} builds ${PRODUCT_BUNDLE_IDENTIFIER}.\"\n  exit 1\nfi\n# The Dev file started as a copy of the Prod one. Until it is replaced by the file Firebase issues\n# for the dev bundle identifier, the dev app gets no pushes and reports under the prod app.\nif [ \"${SRC}\" != \"${PROD_PLIST}\" ] && [ \"$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' \"${SRC}\")\" = \"$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' \"${PROD_PLIST}\")\" ]; then\n  echo \"warning: ${SRC} is a copy of the Prod file (same GOOGLE_APP_ID). Register ${PRODUCT_BUNDLE_IDENTIFIER} in Firebase and replace it: until then the dev app gets no push notifications and its analytics and crashes are reported under the prod app.\"\nfi\ncp \"${SRC}\" \"${DEST}\"\n";
